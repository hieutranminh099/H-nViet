name: Build Android APK

on:
  push:
    branches: [ "main", "chủ yếu", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cài đặt thư viện & Build Web
        run: |
          npm install --legacy-peer-deps || true
          npm run build || true

      - name: Cấp quyền chạy file Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Chấp nhận License Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build file APK bằng Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            npx cap sync android || true
            cd android && chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace
          fi

      - name: Lưu trữ và xuất file APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: HanViet-FlashHUD-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
          retention-days: 7
