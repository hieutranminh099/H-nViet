name: Build Android APK from Scratch (Capacitor CI/CD)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build HanViet-FlashHUD-APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Install SDK packages (platform 34 + build-tools)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 6. Install dependencies and prepare web assets
        run: |
          npm install --legacy-peer-deps
          npm run build --if-present
          mkdir -p dist
          test -f dist/index.html || echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>HanViet</title></head><body><h2>HanViet</h2></body></html>' > dist/index.html

      - name: 7. Capacitor init, add Android, sync
        run: |
          rm -rf android capacitor.config.json capacitor.config.ts
          npx cap init "HanViet" "com.hanviet.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: 8. Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HanViet-FlashHUD-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: android/app/build/reports
          if-no-files-found: ignore
